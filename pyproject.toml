[build-system]
requires = ["setuptools>=40.8.0", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leiden-communities-openmp"
version = "0.1.0"
description = "High-performance Leiden and Louvain community detection with pandas/Arrow support"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.0.0",
    "pyarrow>=5.0.0",
    "numpy>=1.19.0",
    "pybind11>=2.6.0",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "networkit",
    "tabulate>=0.9.0",
]

[tool.isort]
profile = "black"
